[project]
name = "snake-db"
version = "0.1.0"
description = "A minimal RESP2 Redis-compatible server built from scratch in Python"
readme = "README.md"
authors = [
    { name = "Suresh Kumar", email = "sureshdsk91@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
snake-db = "snake_db:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["snake_db", "helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]
